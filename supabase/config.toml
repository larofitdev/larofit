
[functions.ai-coach]
enabled = true
# Left off on purpose: the gateway check would accept the public anon key.
# The function itself requires a signed-in user's token.
verify_jwt = false
import_map = "./functions/ai-coach/deno.json"
# Uncomment to specify a custom file path to the entrypoint.
# Supported file extensions are: .ts, .js, .mjs, .jsx, .tsx
entrypoint = "./functions/ai-coach/index.ts"
# Specifies static files to be bundled with the function. Supports glob patterns.
# For example, if you want to serve static HTML pages in your function:
# static_files = [ "./functions/ai-coach/*.html" ]

[functions.transcribe]
enabled = true
# Left off on purpose, as for ai-coach: the function itself requires a signed-in user's token.
verify_jwt = false
entrypoint = "./functions/transcribe/index.ts"

[functions.speak]
enabled = true
# Left off on purpose, as for ai-coach: the function itself requires a signed-in user's token.
verify_jwt = false
entrypoint = "./functions/speak/index.ts"
